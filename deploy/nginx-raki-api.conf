# Add inside the server/location block that proxies to the Raki API (127.0.0.1:8082).
# Defense in depth: router.php blocks the same paths inside php -S.
location ~* ^/(?:raki-api/)?(?:storage|migrations|docs|vendor|deploy)(?:/|$) { return 404; }
location ~ /\.(?!well-known/)                                              { return 404; }
location ~* \.(?:md|sql|json|jsonl|log|lock|yml|yaml|sh)$                 { return 404; }
