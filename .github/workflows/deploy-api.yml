name: Deploy Raki API

on:
  push:
    branches:
      - main   # ganti kalau branchnya beda

jobs:
  deploy-raki-api:
    runs-on: self-hosted   # boleh pakai label tambahan kalau lu set

    env:
      APP_DIR: /home/ubuntu/apps/raki_api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync files to server directory
        run: |
          mkdir -p "$APP_DIR"
          rsync -a --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            ./ "$APP_DIR"/

      # Start / restart PHP built-in server lewat PM2 di port 8082
      - name: Start / Restart Raki API with PM2
        run: |
          cd "$APP_DIR"
          export NODE_ENV=production

          # Selalu start ulang (bukan pm2 restart) supaya flag -d ikut terbaca.
          # Upload foto menu: batas aplikasi 10 MB, PHP harus sedikit lebih besar.
          pm2 delete raki_api || true
          pm2 start php --name raki_api -- \
            -d upload_max_filesize=12M -d post_max_size=16M \
            -S 127.0.0.1:8082 -t "$APP_DIR" "$APP_DIR/router.php"

          pm2 save